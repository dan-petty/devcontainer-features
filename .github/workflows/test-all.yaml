name: "CI - Test Features"
on:
  push:
    branches:
      - main
  # debian:sid packages change without a commit here, and the Features pin no version.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      # npm test runs the generated tests on debian:sid, the scenarios and the duplicate tests.
      - name: "Test every Feature on debian:sid"
        if: hashFiles('src/*/devcontainer-feature.json') != ''
        run: npm test

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Test the global scenarios"
        if: hashFiles('test/_global/scenarios.json') != ''
        run: npm run test:global
