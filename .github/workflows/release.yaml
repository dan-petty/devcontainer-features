name: "Release dev container features"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"

permissions:
  contents: read # read the Features

# A second publish waits for the first, so that two runs do not push the same tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write # push the Features and the collection metadata to GHCR
      contents: write # make the release tags through the REST API
    steps:
      # The action makes the release tags through the REST API with GITHUB_TOKEN, not with git push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      # The action installs the newest CLI only when no devcontainer command is on PATH.
      - name: "Put the locked devcontainer CLI on PATH"
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # The paths filter also matches deleted files under src/. The action fails on a
      # missing or empty src folder, so a push that leaves no Feature publishes nothing.
      - name: "Publish"
        if: hashFiles('src/*/devcontainer-feature.json') != ''
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
