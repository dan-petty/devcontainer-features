name: "PR - Test Updated Features"
on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      features: ${{ steps.filter.outputs.changes || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Each Feature pull request adds one filter line: <id>: ./**/<id>/**
      # The step runs only when src/ holds a Feature, because the filters input must not be empty.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: hashFiles('src/*/devcontainer-feature.json') != ''
        with:
          filters: |

  test:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Generated tests for '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: npx devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE" .

  test-scenarios:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Scenarios of '${{ matrix.features }}'"
        env:
          FEATURE: ${{ matrix.features }}
        run: npx devcontainer features test -f "$FEATURE" --skip-autogenerated .

  # The CLI picks its Podman code path when `docker -v` names Podman. Then it starts
  # a container with a non-root remote user with --userns=keep-id. The shim gives the
  # runner's rootless Podman the name docker. Only scenarios with "keepid" in their
  # name run here. They also run in test-scenarios under Docker.
  podman-host:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Put a docker shim to Podman first on PATH"
        run: |
          shim="$RUNNER_TEMP/podman-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec podman "$@"\n' > "$shim/docker"
          chmod +x "$shim/docker"
          echo "$shim" >> "$GITHUB_PATH"

      - name: "Keep-id scenarios of '${{ matrix.features }}' under rootless Podman"
        env:
          FEATURE: ${{ matrix.features }}
        run: |
          docker -v
          npx devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated --filter keepid .
