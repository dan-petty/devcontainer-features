name: "PR - Test Updated Features"
on:
  pull_request:

permissions:
  contents: read # read the files of the pull request

# A new push to the pull request stops the tests of the previous push.
concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The test, test-scenarios and podman-host jobs run on debian:sid, debian:trixie and
# ubuntu:noble, on linux/amd64 only. The scenarios in test/<id>/scenarios.json name
# debian:sid. A scenario job puts its base image in place of debian:sid before the run,
# so scenarios.json must be JSON with no comments.

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the files of the pull request
      pull-requests: read # dorny/paths-filter lists the changed files through the API
    outputs:
      features: ${{ steps.ids.outputs.features || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: json
          filters: |
            features:
              - "src/**"
              - "test/**"

      # The second part of a changed path src/<id>/... or test/<id>/... is the Feature id,
      # so a new Feature needs no edit here. An id without src/<id>/devcontainer-feature.json
      # (a removed Feature, test/_global) gives no test.
      - name: "Get the ids of the changed Features"
        id: ids
        if: steps.filter.outputs.features == 'true'
        env:
          FILES: ${{ steps.filter.outputs.features_files }}
        run: |
          candidates=$(jq -r '[.[] | split("/") | select(length > 2) | .[1]] | unique | .[]' <<< "$FILES")
          ids=()
          while IFS= read -r id; do
            if [ -n "$id" ] && [ -f "src/$id/devcontainer-feature.json" ]; then
              ids+=("$id")
            fi
          done <<< "$candidates"
          features=$(jq -cn '$ARGS.positional' --args "${ids[@]}")
          echo "Changed Features: $features"
          echo "features=$features" >> "$GITHUB_OUTPUT"

  test:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid", "debian:trixie", "ubuntu:noble"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Generated tests for '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        timeout-minutes: 25
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: npx devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE"

  test-scenarios:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid", "debian:trixie", "ubuntu:noble"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Use '${{ matrix.baseImage }}' in the scenarios"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          file="test/$FEATURE/scenarios.json"
          if [ -f "$file" ]; then
            jq --arg image "$BASE_IMAGE" 'walk(if . == "debian:sid" then $image else . end)' "$file" > "$RUNNER_TEMP/scenarios.json"
            mv "$RUNNER_TEMP/scenarios.json" "$file"
          fi

      # The test job runs the duplicate test on the base image. Here it would run on the
      # default image of the CLI, ubuntu:focal.
      - name: "Scenarios of '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        timeout-minutes: 25
        env:
          FEATURE: ${{ matrix.features }}
        run: npx devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated

  # The CLI picks its Podman code path when `docker -v` names Podman. Then it starts
  # a container with a non-root remote user with --userns=keep-id. The shim gives the
  # runner's rootless Podman the name docker. Only scenarios with "keepid" in their
  # name run here. They also run in test-scenarios under Docker.
  podman-host:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid", "debian:trixie", "ubuntu:noble"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Use '${{ matrix.baseImage }}' in the scenarios"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          file="test/$FEATURE/scenarios.json"
          if [ -f "$file" ]; then
            jq --arg image "$BASE_IMAGE" 'walk(if . == "debian:sid" then $image else . end)' "$file" > "$RUNNER_TEMP/scenarios.json"
            mv "$RUNNER_TEMP/scenarios.json" "$file"
          fi

      - name: "Put a docker shim to Podman first on PATH"
        run: |
          shim="$RUNNER_TEMP/podman-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec podman "$@"\n' > "$shim/docker"
          chmod +x "$shim/docker"
          echo "$shim" >> "$GITHUB_PATH"

      - name: "Keep-id scenarios of '${{ matrix.features }}' on '${{ matrix.baseImage }}' under rootless Podman"
        timeout-minutes: 25
        env:
          FEATURE: ${{ matrix.features }}
        run: |
          docker -v
          npx devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated --filter keepid
