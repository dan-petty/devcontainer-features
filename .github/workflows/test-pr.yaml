name: "PR - Test Updated Features"
on:
  pull_request:

permissions:
  contents: read # read the files of the pull request

# A new push to the pull request stops the tests of the previous push.
concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The test, test-scenarios and podman-host jobs run on debian:sid, debian:trixie and
# ubuntu:noble, on linux/amd64 only. The scenarios in test/<id>/scenarios.json name
# debian:sid. A scenario job puts its base image in place of debian:sid before the run,
# so scenarios.json must be JSON with no comments.

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the files of the pull request
      pull-requests: read # dorny/paths-filter lists the changed files through the API
    outputs:
      features: ${{ steps.ids.outputs.features || '[]' }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          list-files: json
          filters: |
            features:
              - "src/**"
              - "test/**"
            global:
              - "test/_global/**"

      # The second part of a changed path src/<id>/... or test/<id>/... is the Feature id,
      # so a new Feature needs no edit here. An id without src/<id>/devcontainer-feature.json
      # (a removed Feature) gives no test. A change to the global scenarios gives no Feature
      # id, and the test-global job runs the global scenarios.
      - name: "Get the ids of the changed Features"
        id: ids
        if: steps.filter.outputs.features == 'true'
        env:
          FILES: ${{ steps.filter.outputs.features_files }}
        run: |
          candidates=$(jq -r '[.[] | split("/") | select(length > 2) | .[1]] | unique | .[]' <<< "$FILES")
          ids=()
          while IFS= read -r id; do
            if [ -n "$id" ] && [ -f "src/$id/devcontainer-feature.json" ]; then
              ids+=("$id")
            fi
          done <<< "$candidates"
          features=$(jq -cn '$ARGS.positional' --args "${ids[@]}")
          echo "Changed Features: $features"
          echo "features=$features" >> "$GITHUB_OUTPUT"

  test:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid", "debian:trixie", "ubuntu:noble"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      # podman-outside-podman is a client of the Podman engine of the host.
      - name: "Start the Podman API services of the runner"
        if: matrix.features == 'podman-outside-podman'
        timeout-minutes: 5
        run: .github/scripts/start-podman-host.sh

      # Without XDG_RUNTIME_DIR, the default mount source of podman-outside-podman is
      # /run/user/1000/podman, as on a host where the variable is not set.
      - name: "Generated tests for '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        timeout-minutes: 25
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          unset XDG_RUNTIME_DIR
          npx devcontainer features test --skip-scenarios -f "$FEATURE" -i "$BASE_IMAGE"

      # podman-in-podman and podman-outside-podman cannot be in one container. The install
      # of each one stops when the directory of the other one exists.
      - name: "Install '${{ matrix.features }}' next to the other Podman Feature"
        if: matrix.features == 'podman-in-podman' || matrix.features == 'podman-outside-podman'
        timeout-minutes: 5
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          other=podman-in-podman
          if [ "$FEATURE" = podman-in-podman ]; then
            other=podman-outside-podman
          fi
          status=0
          out=$(docker run --rm -v "$PWD/src/$FEATURE:/feature:ro" -e OTHER="$other" "$BASE_IMAGE" \
            bash -c 'mkdir -p "/usr/local/share/$OTHER" && cd /feature && bash install.sh' 2>&1) || status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::install.sh of $FEATURE did not stop next to $other."
            exit 1
          fi
          grep -F '(!) podman-in-podman and podman-outside-podman cannot be in one container.' <<< "$out"

  test-scenarios:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid", "debian:trixie", "ubuntu:noble"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Use '${{ matrix.baseImage }}' in the scenarios"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          file="test/$FEATURE/scenarios.json"
          if [ -f "$file" ]; then
            jq --arg image "$BASE_IMAGE" 'walk(if . == "debian:sid" then $image else . end)' "$file" > "$RUNNER_TEMP/scenarios.json"
            mv "$RUNNER_TEMP/scenarios.json" "$file"
          fi

      - name: "Start the Podman API services of the runner"
        if: matrix.features == 'podman-outside-podman'
        timeout-minutes: 5
        run: .github/scripts/start-podman-host.sh

      # The test job runs the duplicate test on the base image. Here it would run on the
      # default image of the CLI, ubuntu:focal.
      - name: "Scenarios of '${{ matrix.features }}' on '${{ matrix.baseImage }}'"
        timeout-minutes: 25
        env:
          FEATURE: ${{ matrix.features }}
        run: |
          set -o pipefail
          npx devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated 2>&1 | tee "$RUNNER_TEMP/scenarios.log"

      # In the with_docker_in_docker scenario of a Podman Feature, the install skips
      # dockerCompat and prints one line in the build log. A test in the container cannot
      # read the build log.
      - name: "Find the dockerCompat skip line of '${{ matrix.features }}'"
        env:
          FEATURE: ${{ matrix.features }}
        run: |
          file="test/$FEATURE/scenarios.json"
          if [ -f "$file" ] && jq -e 'has("with_docker_in_docker")' "$file" > /dev/null; then
            grep -F "(!) $FEATURE: " "$RUNNER_TEMP/scenarios.log" | grep -F 'dockerCompat is skipped.'
          fi

  # The CLI picks its Podman code path when `docker -v` names Podman. Then it starts
  # a container with a non-root remote user with --userns=keep-id. The shim gives the
  # runner's rootless Podman the name docker. Only scenarios with "keepid" in their
  # name run here. They also run in test-scenarios under Docker.
  podman-host:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.features != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ${{ fromJSON(needs.detect-changes.outputs.features) }}
        baseImage: ["debian:sid", "debian:trixie", "ubuntu:noble"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Use '${{ matrix.baseImage }}' in the scenarios"
        env:
          FEATURE: ${{ matrix.features }}
          BASE_IMAGE: ${{ matrix.baseImage }}
        run: |
          file="test/$FEATURE/scenarios.json"
          if [ -f "$file" ]; then
            jq --arg image "$BASE_IMAGE" 'walk(if . == "debian:sid" then $image else . end)' "$file" > "$RUNNER_TEMP/scenarios.json"
            mv "$RUNNER_TEMP/scenarios.json" "$file"
          fi

      - name: "Put a docker shim to Podman first on PATH"
        run: |
          shim="$RUNNER_TEMP/podman-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec podman "$@"\n' > "$shim/docker"
          chmod +x "$shim/docker"
          echo "$shim" >> "$GITHUB_PATH"

      - name: "Start the Podman API services of the runner"
        if: matrix.features == 'podman-outside-podman'
        timeout-minutes: 5
        run: .github/scripts/start-podman-host.sh

      - name: "Keep-id scenarios of '${{ matrix.features }}' on '${{ matrix.baseImage }}' under rootless Podman"
        timeout-minutes: 25
        env:
          FEATURE: ${{ matrix.features }}
        run: |
          docker -v
          npx devcontainer features test -f "$FEATURE" --skip-autogenerated --skip-duplicated --filter keepid

  # A change to test/_global gives no Feature id, so the Feature jobs above skip it and
  # this job runs the global scenarios.
  test-global:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.global == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Test the global scenarios"
        if: hashFiles('test/_global/scenarios.json') != ''
        timeout-minutes: 25
        run: npm run test:global
