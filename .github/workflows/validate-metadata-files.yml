name: "Validate devcontainer-feature.json files"
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The action validates the schema without the CLI. It fails on a folder with no Feature.
      - name: "Validate devcontainer-feature.json files"
        if: hashFiles('src/*/devcontainer-feature.json') != ''
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: "true"
          base-path-to-features: "./src"
