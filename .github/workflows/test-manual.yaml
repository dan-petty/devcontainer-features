name: "Manual - Test Features"
on:
  workflow_dispatch:
    inputs:
      features:
        description: "Feature ids to test, separated by spaces"
        required: true
      baseImage:
        description: "Base image of the generated tests"
        required: true
        default: "debian:sid"
      logLevel:
        description: "Log level"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug
          - trace

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      # podman-outside-podman is a client of the Podman engine of the host.
      - name: "Start the Podman API services of the runner"
        if: contains(inputs.features, 'podman-outside-podman')
        timeout-minutes: 5
        run: .github/scripts/start-podman-host.sh

      - name: "Test '${{ inputs.features }}' on '${{ inputs.baseImage }}'"
        timeout-minutes: 50
        env:
          FEATURES: ${{ inputs.features }}
          BASE_IMAGE: ${{ inputs.baseImage }}
          LOG_LEVEL: ${{ inputs.logLevel }}
        run: |
          read -ra ids <<< "$FEATURES"
          npx devcontainer features test --features "${ids[@]}" --base-image "$BASE_IMAGE" --log-level "$LOG_LEVEL"
