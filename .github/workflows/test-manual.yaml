name: "Manual - Test Features"
on:
  workflow_dispatch:
    inputs:
      features:
        description: "Feature ids to test, separated by spaces"
        required: true
      baseImage:
        description: "Base image of the generated tests"
        required: true
        default: "debian:sid"
      logLevel:
        description: "Log level"
        required: true
        default: "info"
        type: choice
        options:
          - info
          - debug
          - trace

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Install the devcontainer CLI from package-lock.json"
        run: npm ci

      - name: "Test '${{ inputs.features }}' on '${{ inputs.baseImage }}'"
        env:
          FEATURES: ${{ inputs.features }}
          BASE_IMAGE: ${{ inputs.baseImage }}
          LOG_LEVEL: ${{ inputs.logLevel }}
        run: |
          read -ra ids <<< "$FEATURES"
          npx devcontainer features test --features "${ids[@]}" --base-image "$BASE_IMAGE" --log-level "$LOG_LEVEL" .
